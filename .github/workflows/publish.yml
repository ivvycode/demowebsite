name: Publish site

# Copies site/ from main to the root of the gh-pages branch, which GitHub Pages serves.
# Run it from the Actions tab: "Publish site" > "Run workflow".
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-gh-pages
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Configure git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
      - name: Publish site/ to gh-pages
        run: scripts/publish.sh
