<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page not found — ACME Venue</title>
  <!--
    GitHub Pages serves this file for ANY missing URL, at any depth, so relative
    paths can't be trusted here. Styles are inline and the home link is worked
    out at runtime so it works on both the github.io project URL
    (/demowebsite/) and a custom domain (/).
  -->
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 20px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
           background: #14110f; color: #f5f1ea; text-align: center; }
    h1 { font-family: Georgia, serif; font-size: 3rem; margin: 0 0 0.25em; }
    p { color: #c9c0b3; }
    a { display: inline-block; margin-top: 16px; padding: 12px 26px; border-radius: 999px;
        background: #b8864b; color: #fff; text-decoration: none; font-weight: 600; }
  </style>
</head>
<body>
  <main>
    <h1>Page not found</h1>
    <p>Sorry, we couldn't find that page.</p>
    <a id="home-link" href="index.html">Back to home</a>
  </main>
  <script>
    (function () {
      var l = window.location;
      if (l.protocol === "file:") return;
      var base = "/";
      if (/\.github\.io$/.test(l.hostname)) {
        var first = l.pathname.split("/")[1];
        if (first) base = "/" + first + "/";
      }
      document.getElementById("home-link").href = base;
    })();
  </script>
</body>
</html>
